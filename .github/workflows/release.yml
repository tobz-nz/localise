name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            asset: localise-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            asset: localise-aarch64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            asset: localise-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            asset: localise-aarch64-unknown-linux-gnu
          - target: x86_64-pc-windows-msvc
            asset: localise-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile
        run: |
          deno compile -A --no-config --bundle --engine quickjs --target ${{ matrix.target }} \
            -o ${{ matrix.asset }} localise.ts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
